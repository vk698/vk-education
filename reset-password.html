<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password - StudyHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    :root { --accent: #f97316; --accent-light: #ff9f4a; --text-light: #f8fafc; --text-dim: #cbd5e1; --glass-border: rgba(255,255,255,0.1); }
    body { background: #0a0f1c; min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
    #threejs-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.4; }
    .reset-container { background: rgba(15,23,42,0.75); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 32px; width: 100%; max-width: 480px; padding: 2rem; animation: fadeSlideUp 0.6s ease-out; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .logo { display: flex; align-items: center; justify-content: center; gap: 0.6rem; font-size: 1.8rem; font-weight: 800; margin-bottom: 1rem; }
    .logo i { color: var(--accent); font-size: 2rem; }
    .logo span { background: linear-gradient(120deg, #fff, var(--accent)); background-clip: text; -webkit-background-clip: text; color: transparent; }
    h1 { font-size: 1.8rem; margin-bottom: 1rem; background: linear-gradient(120deg, #fff, var(--accent)); background-clip: text; -webkit-background-clip: text; color: transparent; text-align: center; }
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-dim); font-weight: 500; }
    input { width: 100%; padding: 0.8rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 40px; color: white; font-size: 1rem; transition: 0.2s; }
    input:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.1); }
    .btn { width: 100%; padding: 0.8rem; background: var(--accent); color: white; border: none; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; }
    .btn:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(249,115,22,0.3); }
    .back-link { margin-top: 1rem; text-align: center; }
    .back-link a { color: var(--accent); text-decoration: none; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #2ecc71; color: white; padding: 12px 20px; border-radius: 40px; font-size: 0.9rem; z-index: 2000; opacity: 0; transform: translateY(20px); transition: all 0.3s ease; }
    .toast.error { background: #e74c3c; }
    .toast.show { opacity: 1; transform: translateY(0); }
    hr { margin: 1rem 0; border-color: var(--glass-border); }
    details summary { cursor: pointer; color: var(--accent); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div id="threejs-bg"></div>
  <div class="reset-container">
    <div class="logo"><i class="fas fa-graduation-cap"></i> <span>StudyHub</span></div>
    <h1>Set New Password</h1>
    <div id="msg" class="toast" style="position: relative; bottom: auto; right: auto; margin-bottom: 1rem; display: none;"></div>
    <form id="resetForm">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" required>
      </div>
      <button type="submit" class="btn" id="resetBtn">Reset Password</button>
    </form>
    <hr>
    <details>
      <summary>🔧 Token not working? Paste full link</summary>
      <div class="form-group" style="margin-top:1rem;">
        <input type="text" id="manualUrl" placeholder="https://...?token=...">
        <button type="button" id="extractTokenBtn" style="margin-top:0.5rem;">Extract Token</button>
      </div>
    </details>
    <div class="back-link"><a href="login.html">← Back to Login</a></div>
  </div>

  <script>
    const API_BASE = "https://studyhub-backend-f15o.onrender.com";
    const urlParams = new URLSearchParams(window.location.search);
    let token = urlParams.get('token');
    const msgDiv = document.getElementById('msg');
    const resetForm = document.getElementById('resetForm');
    const resetBtn = document.getElementById('resetBtn');
    const manualUrlInput = document.getElementById('manualUrl');
    const extractBtn = document.getElementById('extractTokenBtn');

    function showMessage(text, type) {
      msgDiv.innerText = text;
      msgDiv.className = `toast ${type}`;
      msgDiv.style.display = 'block';
      setTimeout(() => { msgDiv.style.display = 'none'; }, 5000);
    }

    if (!token) {
      resetForm.style.opacity = '0.5';
      resetBtn.disabled = true;
      showMessage("⚠️ No token found. Paste the full link from your email below.", "error");
    } else {
      resetForm.style.opacity = '1';
      resetBtn.disabled = false;
    }

    extractBtn.addEventListener('click', () => {
      const fullUrl = manualUrlInput.value.trim();
      if (!fullUrl) {
        showMessage("Please paste the full reset link.", "error");
        return;
      }
      try {
        const urlObj = new URL(fullUrl);
        const extractedToken = urlObj.searchParams.get('token');
        if (extractedToken) {
          token = extractedToken;
          window.history.replaceState({}, '', window.location.pathname + '?token=' + token);
          showMessage("✅ Token extracted! You can now reset your password.", "success");
          resetForm.style.opacity = '1';
          resetBtn.disabled = false;
        } else {
          showMessage("Invalid link – no token parameter found.", "error");
        }
      } catch(e) {
        showMessage("Invalid URL format. Copy the entire link from your email.", "error");
      }
    });

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!token) {
        showMessage("No token available. Use manual entry.", "error");
        return;
      }
      const password = document.getElementById('password').value.trim();
      const confirm = document.getElementById('confirmPassword').value.trim();

      if (password !== confirm) {
        showMessage("Passwords do not match.", "error");
        return;
      }
      if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", "error");
        return;
      }

      resetBtn.disabled = true;
      resetBtn.innerHTML = 'Resetting...';

      try {
        const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password })
        });
        const data = await res.json();
        if (res.ok) {
          showMessage("✅ Password reset successful! Redirecting to login...", "success");
          setTimeout(() => { window.location.href = 'login.html'; }, 3000);
        } else {
          showMessage(data.error || "Reset failed. Token may be expired.", "error");
          resetBtn.disabled = false;
          resetBtn.innerHTML = 'Reset Password';
        }
      } catch (err) {
        showMessage("Server error. Try again later.", "error");
        resetBtn.disabled = false;
        resetBtn.innerHTML = 'Reset Password';
      }
    });
  </script>
</body>
</html>
