<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Profile - StudyHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
    }
    :root {
      --accent: #f97316;
      --accent-light: #ff9f4a;
      --text-light: #f8fafc;
      --text-dim: #cbd5e1;
      --glass-border: rgba(255,255,255,0.1);
    }
    body {
      background: #0a0f1c;
      color: var(--text-light);
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(16px);
      background: rgba(10,15,28,0.7);
      border-bottom: 1px solid var(--glass-border);
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { display: flex; align-items: center; gap: 0.6rem; font-size: 1.8rem; font-weight: 800; }
    .logo i { color: var(--accent); font-size: 2rem; }
    .logo span { background: linear-gradient(120deg, #fff, var(--accent)); background-clip: text; -webkit-background-clip: text; color: transparent; }
    nav { display: flex; gap: 1.2rem; }
    nav a { color: var(--text-dim); text-decoration: none; font-weight: 500; }
    nav a:hover { color: var(--accent); }
    .profile-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 2rem;
      background: rgba(15,23,42,0.75);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
    }
    .avatar {
      text-align: center;
      margin-bottom: 2rem;
    }
    .avatar img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      color: white;
      font-family: inherit;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      cursor: pointer;
      margin-right: 10px;
      transition: 0.2s;
    }
    button:hover { background: var(--accent-light); transform: translateY(-2px); }
    .btn-secondary { background: #95a5a6; }
    .logout { margin-top: 2rem; text-align: center; }
    .blogs-section {
      margin-top: 2rem;
      border-top: 1px solid var(--glass-border);
      padding-top: 1.5rem;
    }
    .blog-item {
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .blog-info h4 { color: var(--accent); margin-bottom: 5px; }
    .delete-blog { background: #e74c3c; padding: 5px 12px; border-radius: 20px; }
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: #2ecc71; padding: 12px 20px;
      border-radius: 40px; z-index: 2000; opacity: 0; transform: translateY(20px);
      transition: 0.3s; pointer-events: none;
    }
    .toast.error { background: #e74c3c; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <header>
    <div class="logo"><i class="fas fa-graduation-cap"></i> <span>StudyHub</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="notes.html">Notes</a>
      <a href="community.html">Community</a>
      <a href="exams.html">Exams</a>
    </nav>
    <button id="logoutBtn" style="background:transparent; border:1px solid var(--accent);">Logout</button>
  </header>

  <div class="profile-container">
    <div style="display: flex; justify-content: flex-end;">
      <button id="closeProfileBtn" style="background:#7f8c8d;"><i class="fas fa-times"></i> Close</button>
    </div>
    <h2 style="color:var(--accent);">My Profile</h2>
    <div class="avatar">
      <img id="profileImg" src="https://via.placeholder.com/120" alt="Profile">
    </div>
    <form id="profileForm">
      <div class="form-group">
        <label>Profile Picture</label>
        <input type="file" id="profilePicture" accept="image/*">
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" disabled style="background:#2d2d44;">
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea id="bio" rows="4"></textarea>
      </div>
      <button type="submit">Update Profile</button>
    </form>

    <div class="blogs-section">
      <h3><i class="fas fa-pen-nib"></i> My Blogs</h3>
      <div id="myBlogsList">Loading...</div>
    </div>

    <div class="logout">
      <button id="logoutBtn2" class="btn-secondary">Logout</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = "https://studyhub-backend-f15o.onrender.com"; // CHANGE to your backend URL
    const token = localStorage.getItem('studyhub_token');
    if (!token) window.location.href = 'login.html';

    let currentUser = null;
    const toast = document.getElementById('toast');

    function showToast(msg, isErr = false) {
      toast.textContent = msg;
      toast.className = isErr ? 'toast error show' : 'toast show';
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function loadProfile() {
      try {
        const res = await fetch(`${API_BASE}/api/auth/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const user = await res.json();
        if (res.ok) {
          currentUser = user;
          document.getElementById('name').value = user.fullname;
          document.getElementById('email').value = user.email;
          document.getElementById('bio').value = user.about || '';
          if (user.avatarUrl) document.getElementById('profileImg').src = user.avatarUrl;
          loadMyBlogs(user._id);
        } else {
          showToast('Session expired. Please login again.', true);
          localStorage.clear();
          setTimeout(() => window.location.href = 'login.html', 2000);
        }
      } catch (err) { console.error(err); }
    }

    async function loadMyBlogs(userId) {
      const container = document.getElementById('myBlogsList');
      try {
        const res = await fetch(`${API_BASE}/api/blog/user/${userId}`);
        const blogs = await res.json();
        if (blogs.length === 0) {
          container.innerHTML = '<p>No blogs yet. <a href="create-blog.html">Create your first blog</a>.</p>';
          return;
        }
        container.innerHTML = '';
        blogs.forEach(blog => {
          const div = document.createElement('div');
          div.className = 'blog-item';
          div.innerHTML = `
            <div class="blog-info">
              <h4>${escapeHtml(blog.title)}</h4>
              <p>${escapeHtml(blog.content.substring(0, 100))}...</p>
              <small>${new Date(blog.createdAt).toLocaleDateString()}</small>
            </div>
            <button class="delete-blog" data-id="${blog._id}"><i class="fas fa-trash"></i> Delete</button>
          `;
          container.appendChild(div);
        });
        document.querySelectorAll('.delete-blog').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (confirm('Delete this blog?')) {
              await deleteBlog(btn.getAttribute('data-id'));
              loadMyBlogs(userId);
            }
          });
        });
      } catch (err) {
        container.innerHTML = '<p>Error loading blogs.</p>';
      }
    }

    async function deleteBlog(blogId) {
      try {
        const res = await fetch(`${API_BASE}/api/blog/${blogId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) alert('Delete failed');
      } catch (err) { alert('Error deleting'); }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullname = document.getElementById('name').value;
      const about = document.getElementById('bio').value;
      const fileInput = document.getElementById('profilePicture');
      const formData = new FormData();
      formData.append('fullname', fullname);
      formData.append('about', about);
      if (fileInput.files[0]) formData.append('avatarUrl', fileInput.files[0]);

      try {
        const res = await fetch(`${API_BASE}/api/auth/update`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const updatedUser = await res.json();
        if (res.ok) {
          localStorage.setItem('studyhub_user', JSON.stringify(updatedUser));
          if (updatedUser.avatarUrl) document.getElementById('profileImg').src = updatedUser.avatarUrl;
          showToast('Profile updated!');
        } else showToast(updatedUser.error || 'Update failed', true);
      } catch (err) { showToast('Error updating profile', true); }
    });

    function logout() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('logoutBtn2').onclick = logout;
    document.getElementById('closeProfileBtn').onclick = () => window.location.href = 'index.html';

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    loadProfile();
  </script>
</body>
</html>
