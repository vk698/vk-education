<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Forgot Password - StudyHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    :root { --accent: #f97316; --accent-light: #ff9f4a; --text-light: #f8fafc; --text-dim: #cbd5e1; --glass-border: rgba(255,255,255,0.1); }
    body { background: #0a0f1c; min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
    #threejs-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.4; }
    .forgot-container { background: rgba(15,23,42,0.75); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 32px; width: 100%; max-width: 450px; padding: 2rem; text-align: center; animation: fadeSlideUp 0.6s ease-out; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .logo { display: flex; align-items: center; justify-content: center; gap: 0.6rem; font-size: 1.8rem; font-weight: 800; margin-bottom: 1rem; }
    .logo i { color: var(--accent); font-size: 2rem; }
    .logo span { background: linear-gradient(120deg, #fff, var(--accent)); background-clip: text; -webkit-background-clip: text; color: transparent; }
    h1 { font-size: 1.8rem; margin-bottom: 1rem; background: linear-gradient(120deg, #fff, var(--accent)); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-dim); font-weight: 500; }
    input { width: 100%; padding: 0.8rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 40px; color: white; font-size: 1rem; transition: 0.2s; }
    input:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.1); }
    .btn { width: 100%; padding: 0.8rem; background: var(--accent); color: white; border: none; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; }
    .btn:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(249,115,22,0.3); }
    .back-link { margin-top: 1rem; color: var(--text-dim); }
    .back-link a { color: var(--accent); text-decoration: none; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #2ecc71; color: white; padding: 12px 20px; border-radius: 40px; font-size: 0.9rem; z-index: 2000; opacity: 0; transform: translateY(20px); transition: all 0.3s ease; }
    .toast.error { background: #e74c3c; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div id="threejs-bg"></div>
  <div class="forgot-container">
    <div class="logo"><i class="fas fa-graduation-cap"></i> <span>StudyHub</span></div>
    <h1>Reset Password</h1>
    <p style="color: var(--text-dim); margin-bottom: 1.5rem;">Enter your email and we'll send you a reset link.</p>
    <form id="forgotForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <button type="submit" class="btn" id="sendBtn">Send Reset Link</button>
    </form>
    <div class="back-link"><a href="login.html">← Back to Login</a></div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = "https://studyhub-backend-f15o.onrender.com";
    const form = document.getElementById('forgotForm');
    const btn = document.getElementById('sendBtn');
    const toast = document.getElementById('toast');

    function showToast(msg, isErr = false) {
      toast.textContent = msg;
      toast.className = isErr ? 'toast error show' : 'toast show';
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok) {
          showToast('Reset link sent! Check your email.');
          form.reset();
        } else {
          showToast(data.error || 'Failed to send reset link', true);
        }
      } catch (err) {
        showToast('Server error. Try again later.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
