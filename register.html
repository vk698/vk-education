<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign Up - StudyHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        :root {
            --accent: #f97316;
            --accent-light: #ff9f4a;
            --text-light: #f8fafc;
            --text-dim: #cbd5e1;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            background: #0a0f1c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        #threejs-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
            pointer-events: none;
        }
        .register-container {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            animation: fadeSlideUp 0.6s ease-out;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { display: flex; align-items: center; justify-content: center; gap: 0.6rem; font-size: 1.8rem; font-weight: 800; margin-bottom: 1rem; }
        .logo i { color: var(--accent); font-size: 2rem; }
        .logo span { background: linear-gradient(120deg, #fff, var(--accent)); background-clip: text; -webkit-background-clip: text; color: transparent; }
        h1 { font-size: 1.8rem; margin-bottom: 1.5rem; background: linear-gradient(120deg, #fff, var(--accent)); background-clip: text; -webkit-background-clip: text; color: transparent; text-align: center; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-dim); font-weight: 500; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            font-size: 1rem;
            color: white;
            transition: 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.1); }
        .btn {
            width: 100%;
            padding: 0.8rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }
        .btn:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(249,115,22,0.3); }
        .login-link { margin-top: 1rem; text-align: center; color: var(--text-dim); }
        .login-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .toast {
            position: fixed; bottom: 20px; right: 20px; background: #2ecc71; color: white;
            padding: 12px 20px; border-radius: 40px; font-size: 0.9rem; z-index: 2000;
            opacity: 0; transform: translateY(20px); transition: all 0.3s ease;
        }
        .toast.error { background: #e74c3c; }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <div id="threejs-bg"></div>
    <div class="register-container">
        <div class="logo"><i class="fas fa-graduation-cap"></i> <span>StudyHub</span></div>
        <h1>Create Account</h1>
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullname" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" minlength="6" required>
            </div>
            <div class="form-group">
                <label>Grade Level</label>
                <select id="grade">
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                    <option value="college">College</option>
                </select>
            </div>
            <div class="form-group">
                <label>Subjects of Interest (comma separated)</label>
                <input type="text" id="subjects" placeholder="e.g., Math, Physics, Programming">
            </div>
            <button type="submit" class="btn" id="signupBtn">Sign Up</button>
        </form>
        <div class="login-link">Already have an account? <a href="login.html">Login</a></div>
    </div>
    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 3D background (same as login)
        (function() {
            const container = document.getElementById('threejs-bg');
            if (!container) return;
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1c);
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);
            const pointLight = new THREE.PointLight(0xf97316, 0.8);
            pointLight.position.set(2, 3, 4);
            scene.add(pointLight);
            const fillLight = new THREE.PointLight(0x4c1d95, 0.5);
            fillLight.position.set(-2, 1, -3);
            scene.add(fillLight);
            const geometry = new THREE.TorusKnotGeometry(1.2, 0.3, 200, 32);
            const material = new THREE.MeshStandardMaterial({ color: 0xf97316, emissive: 0x4c1d95, roughness: 0.4, metalness: 0.6 });
            const knot = new THREE.Mesh(geometry, material);
            scene.add(knot);
            const particleCount = 1500;
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 30;
                positions[i*3+1] = (Math.random() - 0.5) * 20;
                positions[i*3+2] = (Math.random() - 0.5) * 20 - 10;
            }
            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particleMat = new THREE.PointsMaterial({ color: 0xfacc15, size: 0.07, transparent: true, opacity: 0.6 });
            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for (let i = 0; i < 2000; i++) {
                starPos.push((Math.random() - 0.5) * 200);
                starPos.push((Math.random() - 0.5) * 100);
                starPos.push((Math.random() - 0.5) * 60 - 20);
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);
            function animate() {
                requestAnimationFrame(animate);
                knot.rotation.x += 0.005;
                knot.rotation.y += 0.008;
                knot.rotation.z += 0.003;
                particles.rotation.y += 0.0005;
                stars.rotation.x += 0.0002;
                renderer.render(scene, camera);
            }
            animate();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        })();

        // Signup logic
        const API_BASE = "https://studyhub-backend-f15o.onrender.com";
        const form = document.getElementById('registerForm');
        const btn = document.getElementById('signupBtn');
        const toast = document.getElementById('toast');

        function showToast(msg, isErr = false) {
            toast.textContent = msg;
            toast.className = isErr ? 'toast error show' : 'toast show';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const grade = document.getElementById('grade').value;
            const subjectsRaw = document.getElementById('subjects').value;
            const subjects = subjectsRaw ? subjectsRaw.split(',').map(s => s.trim()).filter(s => s) : [];

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, email, password, grade, subjects })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('studyhub_token', data.token);
                    localStorage.setItem('studyhub_user', JSON.stringify(data.user));
                    showToast('Account created! Redirecting...');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    showToast(data.error || 'Signup failed', true);
                    btn.disabled = false;
                    btn.textContent = 'Sign Up';
                }
            } catch (err) {
                console.error(err);
                showToast('Server error. Please try again later.', true);
                btn.disabled = false;
                btn.textContent = 'Sign Up';
            }
        });
    </script>
</body>
</html>
