<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - StudyHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        :root {
            --accent: #f97316;
            --accent-light: #ff9f4a;
            --text-light: #f8fafc;
            --text-dim: #cbd5e1;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: #0a0f1c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 3D background container */
        #threejs-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Floating particles overlay */
        .particles-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 30% 40%, rgba(0,0,0,0.2), transparent);
        }

        .login-container {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.3);
            animation: fadeSlideUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            transform-origin: center;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1rem;
            animation: fadeIn 0.8s ease 0.2s backwards;
        }
        .logo i { color: var(--accent); font-size: 2rem; }
        .logo span { background: linear-gradient(120deg, #fff, var(--accent)); background-clip: text; -webkit-background-clip: text; color: transparent; }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            background: linear-gradient(120deg, #fff, var(--accent));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: fadeIn 0.8s ease 0.3s backwards;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
            animation: fadeIn 0.8s ease 0.4s backwards;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dim);
            font-weight: 500;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            font-size: 1rem;
            color: white;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.12);
            box-shadow: 0 0 0 3px rgba(249,115,22,0.2);
            transform: scale(1.01);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.8s ease 0.5s backwards;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(249,115,22,0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .forgot-password {
            display: block;
            margin-top: 1rem;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
            animation: fadeIn 0.8s ease 0.6s backwards;
        }

        .forgot-password:hover {
            color: var(--accent);
        }

        .divider {
            margin: 1.5rem 0;
            position: relative;
            text-align: center;
            color: var(--text-dim);
            animation: fadeIn 0.8s ease 0.7s backwards;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--glass-border);
            z-index: -1;
        }

        .divider span {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            padding: 0 1rem;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.8s ease 0.8s backwards;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-dim);
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .signup-link {
            margin-top: 1rem;
            color: var(--text-dim);
            animation: fadeIn 0.8s ease 0.9s backwards;
        }

        .signup-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2ecc71;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 2000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
        .toast.error {
            background: #e74c3c;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="threejs-bg"></div>
    <div class="particles-overlay"></div>

    <div class="login-container">
        <div class="logo"><i class="fas fa-graduation-cap"></i> <span>StudyHub</span></div>
        <h1>Welcome Back!</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="loginBtn">Login</button>
            <a href="#" class="forgot-password">Forgot password?</a>
        </form>
        
        <div class="divider"><span>or</span></div>
        
        <div class="social-login">
            <button class="social-btn">G</button>
            <button class="social-btn">F</button>
            <button class="social-btn">A</button>
        </div>
        
        <div class="signup-link">
            Don't have an account? <a href="register.html">Sign up</a>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ========== 3D BACKGROUND SCENE ==========
        (function init3DBackground() {
            const container = document.getElementById('threejs-bg');
            if (!container) return;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1c);
            
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            
            // Lights
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);
            const pointLight = new THREE.PointLight(0xf97316, 0.8);
            pointLight.position.set(2, 3, 4);
            scene.add(pointLight);
            const fillLight = new THREE.PointLight(0x4c1d95, 0.5);
            fillLight.position.set(-2, 1, -3);
            scene.add(fillLight);
            
            // Central geometry – torus knot (rotating)
            const geometry = new THREE.TorusKnotGeometry(1.2, 0.3, 200, 32);
            const material = new THREE.MeshStandardMaterial({ color: 0xf97316, emissive: 0x4c1d95, roughness: 0.4, metalness: 0.6 });
            const knot = new THREE.Mesh(geometry, material);
            scene.add(knot);
            
            // Floating particles
            const particleCount = 1500;
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 30;
                positions[i*3+1] = (Math.random() - 0.5) * 20;
                positions[i*3+2] = (Math.random() - 0.5) * 20 - 10;
            }
            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particleMat = new THREE.PointsMaterial({ color: 0xfacc15, size: 0.07, transparent: true, opacity: 0.6 });
            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);
            
            // Stars background
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for (let i = 0; i < 2000; i++) {
                starPos.push((Math.random() - 0.5) * 200);
                starPos.push((Math.random() - 0.5) * 100);
                starPos.push((Math.random() - 0.5) * 60 - 20);
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);
            
            let time = 0;
            function animate() {
                requestAnimationFrame(animate);
                time += 0.005;
                knot.rotation.x += 0.005;
                knot.rotation.y += 0.008;
                knot.rotation.z += 0.003;
                particles.rotation.y += 0.0005;
                stars.rotation.x += 0.0002;
                stars.rotation.y += 0.0003;
                renderer.render(scene, camera);
            }
            animate();
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        })();
    </script>

    <script>
        // ========== LOGIN LOGIC ==========
        const API_BASE = "https://studyhub-backend-f15o.onrender.com";
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const toast = document.getElementById('toast');

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = isError ? 'toast error show' : 'toast show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showToast('Please fill all fields', true);
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('studyhub_token', data.token);
                    localStorage.setItem('studyhub_user', JSON.stringify(data.user));
                    showToast('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showToast(data.error || 'Invalid email or password', true);
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (err) {
                console.error(err);
                showToast('Server error. Please try again later.', true);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
