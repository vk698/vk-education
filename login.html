<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login - StudyHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
    }
    :root {
      --accent: #f97316;
      --accent-light: #ff9f4a;
      --text-light: #f8fafc;
      --text-dim: #cbd5e1;
      --glass-border: rgba(255,255,255,0.1);
    }
    body {
      background: #0a0f1c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #threejs-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.4;
    }
    .login-container {
      background: rgba(15,23,42,0.75);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      width: 100%;
      max-width: 450px;
      padding: 2rem;
      text-align: center;
      animation: fadeSlideUp 0.6s ease-out;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { display: flex; align-items: center; justify-content: center; gap: 0.6rem; font-size: 1.8rem; font-weight: 800; margin-bottom: 1rem; }
    .logo i { color: var(--accent); font-size: 2rem; }
    .logo span { background: linear-gradient(120deg, #fff, var(--accent)); background-clip: text; -webkit-background-clip: text; color: transparent; }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; background: linear-gradient(120deg, #fff, var(--accent)); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-dim); font-weight: 500; }
    input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      color: white;
      font-size: 1rem;
      transition: 0.2s;
    }
    input:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.1); }
    .btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.5rem;
    }
    .btn:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(249,115,22,0.3); }
    .forgot-password { display: block; margin-top: 1rem; color: var(--text-dim); text-decoration: none; font-size: 0.85rem; }
    .forgot-password:hover { color: var(--accent); }
    .divider { margin: 1.5rem 0; position: relative; text-align: center; color: var(--text-dim); }
    .divider::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--glass-border); z-index: -1; }
    .divider span { background: rgba(15,23,42,0.7); padding: 0 1rem; }
    .social-login { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; }
    .social-btn {
      width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-dim); transition: 0.2s;
    }
    .social-btn:hover { background: var(--accent); color: white; transform: translateY(-3px); }
    .signup-link { margin-top: 1rem; color: var(--text-dim); }
    .signup-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: #2ecc71; color: white;
      padding: 12px 20px; border-radius: 40px; font-size: 0.9rem; z-index: 2000;
      opacity: 0; transform: translateY(20px); transition: all 0.3s ease;
    }
    .toast.error { background: #e74c3c; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div id="threejs-bg"></div>
  <div class="login-container">
    <div class="logo"><i class="fas fa-graduation-cap"></i> <span>StudyHub</span></div>
    <h1>Welcome Back!</h1>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Login</button>
      <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
    </form>
    <div class="divider"><span>or</span></div>
    <div class="social-login">
      <button class="social-btn">G</button>
      <button class="social-btn">F</button>
      <button class="social-btn">A</button>
    </div>
    <div class="signup-link">Don't have an account? <a href="register.html">Sign up</a></div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = "https://studyhub-backend-f15o.onrender.com"; // CHANGE to your actual backend URL
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const toast = document.getElementById('toast');

    function showToast(msg, isErr = false) {
      toast.textContent = msg;
      toast.className = isErr ? 'toast error show' : 'toast show';
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('studyhub_token', data.token);
          localStorage.setItem('studyhub_user', JSON.stringify(data.user));
          showToast('Login successful! Redirecting...');
          setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        } else {
          showToast(data.error || 'Invalid email or password', true);
          btn.disabled = false;
          btn.textContent = 'Login';
        }
      } catch (err) {
        showToast('Server error. Please try again later.', true);
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
